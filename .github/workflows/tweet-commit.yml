name: Shared Tweet Workflow

on:
  workflow_call: # Allows this workflow to be called by other repositories

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bot Repository
        uses: actions/checkout@v4
        with:
          repository: 'git-doe/commiter' # Fetches the script from central repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install tweepy

      - name: Post Thread to Twitter
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: python .github/scripts/post_tweet.py
